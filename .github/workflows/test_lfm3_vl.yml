name: Test LFM3-VL export

on:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r scripts/requirements_lfm3_vl.txt
      - run: python -m unittest discover -s tests -p test_export_lfm3_vl.py -v
